[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-killswitch-heartbeat"
version = "0.1.0"
description = "Dead man's switch monitor terminating agent execution loops if heartbeat pings from supervisor agents cease"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-killswitch-heartbeat = "agent_killswitch_heartbeat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_killswitch_heartbeat*"]
